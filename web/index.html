<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Decoder Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#F5F5F0] text-[#1A1A1A] h-screen overflow-hidden">
    <div id="app" class="h-full flex flex-col p-4 gap-4">
        <!-- Top control bar -->
        <header class="flex items-center justify-between bg-white rounded-xl shadow-sm px-4 py-3 border border-[#2D5A27]/10">
            <div class="flex items-center gap-3">
                <h1 class="text-lg font-bold tracking-tight">Morse Decoder</h1>
                <span id="status-badge" class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-500">未连接</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="btn-start" class="px-4 py-2 bg-[#2D5A27] hover:bg-[#1f3f1b] text-white rounded-lg text-sm font-medium transition">▶ 开始</button>
                <button id="btn-stop" class="px-4 py-2 bg-[#E8450C] hover:bg-[#c73a0a] text-white rounded-lg text-sm font-medium transition">⏹ 停止</button>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500">信号</span>
                    <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div id="signal-bar" class="h-full bg-gradient-to-r from-green-400 to-green-600 w-0 transition-all duration-100"></div>
                    </div>
                </div>
                <div class="text-sm font-mono"><span class="text-gray-400">WPM</span> <span id="wpm-display">20</span></div>
                <button id="btn-settings" class="p-2 hover:bg-gray-100 rounded-lg transition">⚙️</button>
            </div>
        </header>

        <!-- Main content -->
        <main class="flex-1 grid grid-cols-12 gap-4 min-h-0">
            <!-- Left: Decoding tree -->
            <section class="col-span-7 bg-white rounded-xl shadow-sm border border-[#2D5A27]/10 relative overflow-hidden flex flex-col">
                <div class="absolute inset-0 pointer-events-none pcb-pattern opacity-30"></div>
                <div class="p-3 border-b border-[#2D5A27]/10 flex justify-between items-center relative z-10">
                    <h2 class="text-sm font-semibold text-[#2D5A27]">摩斯解码树</h2>
                    <div id="current-path" class="text-xs font-mono text-[#C99E3C]">路径: -</div>
                </div>
                <div class="flex-1 relative" id="tree-container">
                    <svg id="morse-tree" class="w-full h-full" preserveAspectRatio="xMidYMid meet"></svg>
                </div>
                <div class="p-3 border-t border-[#2D5A27]/10 relative z-10 flex justify-between items-center">
                    <div class="text-xs text-gray-500">当前字母: <span id="current-letter" class="text-lg font-bold text-[#E8450C] font-mono">-</span></div>
                    <div class="text-xs text-gray-400">滴→右 / 嗒→左</div>
                </div>
            </section>

            <!-- Right: Decoded text full screen -->
            <section class="col-span-5 bg-[#1A1A1A] rounded-xl shadow-sm border border-[#2D5A27]/10 flex flex-col overflow-hidden">
                <div class="p-3 border-b border-white/10 flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-gray-300">解码结果</h2>
                    <button id="btn-clear" class="text-xs text-gray-500 hover:text-gray-300">清空</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4">
                    <div id="decoded-text" class="font-mono text-[#C99E3C] text-lg font-bold break-all leading-relaxed min-h-[2em] overflow-hidden">—</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="fixed inset-0 bg-black/30 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl p-6 w-96">
            <h3 class="text-lg font-bold mb-4">设置</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">音频设备</label>
                    <select id="device-select" class="w-full px-3 py-2 border rounded-lg text-sm">
                        <option value="">默认设备</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">WPM: <span id="wpm-value">20</span></label>
                    <input id="wpm" type="range" min="5" max="40" value="20" class="w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">增益: <span id="gain-value">1.0</span>x</label>
                    <input id="gain" type="range" min="1" max="10" step="0.5" value="1" class="w-full">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">静噪(SQ): <span id="squelch-value">5</span>%</label>
                    <input id="squelch" type="range" min="0" max="20" step="1" value="5" class="w-full">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button id="btn-close-settings" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">关闭</button>
                <button id="btn-save-settings" class="px-4 py-2 text-sm bg-[#2D5A27] text-white rounded-lg">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/tree.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
